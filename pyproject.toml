[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "trace-k"
version = "1.0.0"
description = "Paraphrase-aware probing and intervention for factual recall"
requires-python = ">=3.10"
dependencies = ["torch>=2.6", "transformers>=4.52,<5", "scikit-learn>=1.5", "PyYAML>=6", "numpy>=1.24"]

[project.optional-dependencies]
dashboard = ["streamlit>=1.40", "plotly>=5"]
synthetic = ["peft>=0.16"]
test = ["pytest>=8"]

[project.scripts]
trace-k = "trace_k.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
